name: Sync to Dewy

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'references/**'
      - '.agents/product-marketing.md'
      - 'scripts/update.sh'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # DEWY_SYNC_TOKEN 시크릿이 존재해야 동작. 설정 가이드: docs/AUTOMATION.md
    steps:
      - name: Checkout marketingskills (this repo)
        uses: actions/checkout@v4
        with:
          path: marketingskills

      - name: Checkout Dewy repo
        uses: actions/checkout@v4
        with:
          repository: hyoeun979704-web/Weddig-Planer-AI-Dewy
          path: dewy
          token: ${{ secrets.DEWY_SYNC_TOKEN }}
          ref: main

      - name: Sync skills + references
        run: |
          mkdir -p dewy/.agents/skills dewy/.agents/references dewy/.agents/scripts
          rm -rf dewy/.agents/skills/* dewy/.agents/references/*
          cp -r marketingskills/skills/. dewy/.agents/skills/
          cp -r marketingskills/references/. dewy/.agents/references/
          cp marketingskills/scripts/update.sh dewy/.agents/scripts/update.sh
          chmod +x dewy/.agents/scripts/update.sh

          # product-marketing.md 는 Dewy 에 아직 없을 때만 설치 (로컬 수정 존중)
          if [ ! -f dewy/.agents/product-marketing.md ]; then
            cp marketingskills/.agents/product-marketing.md dewy/.agents/product-marketing.md
          else
            # 차이 있으면 .upstream 으로 별도 저장
            if ! diff -q dewy/.agents/product-marketing.md marketingskills/.agents/product-marketing.md > /dev/null 2>&1; then
              cp marketingskills/.agents/product-marketing.md dewy/.agents/product-marketing.md.upstream
            fi
          fi

          NEW_SHA=$(git -C marketingskills rev-parse HEAD)
          echo "$NEW_SHA" > dewy/.agents/.dewy-marketingskills.version

          # .claude/skills 심볼링크 (있으면 유지, 없으면 생성)
          if [ ! -e dewy/.claude/skills ]; then
            mkdir -p dewy/.claude
            (cd dewy/.claude && ln -sf ../.agents/skills skills)
          fi

      - name: Show diff summary
        working-directory: dewy
        run: |
          git status --short
          echo "---"
          git diff --stat || true

      - name: Open PR in Dewy repo
        uses: peter-evans/create-pull-request@v6
        with:
          path: dewy
          token: ${{ secrets.DEWY_SYNC_TOKEN }}
          branch: bot/sync-dewy-marketing-skills
          delete-branch: true
          base: main
          commit-message: "chore: sync dewy-marketing-skills (upstream ${{ github.sha }})"
          title: "chore: dewy-marketing-skills 동기화"
          body: |
            ## 자동 동기화

            `weddy_wedding_planer_ai_marketingskills` 레포의 `main` 변경을 Dewy 레포로 동기화합니다.

            **교체 대상**:
            - `.agents/skills/` (완전 교체)
            - `.agents/references/` (완전 교체)
            - `.agents/scripts/update.sh`
            - `.agents/.dewy-marketingskills.version`

            **보호 대상** (하는 로컬 수정 안 던침):
            - `.agents/product-marketing.md` — 이미 존재하면 그대로 둡니다. upstream 변경은 `.agents/product-marketing.md.upstream` 로 저장되니 필요시 수동 병합.

            **업스트림 commit**: ${{ github.sha }}
            **Trigger**: ${{ github.event_name }}

            자동으로 생성된 PR 입니다. 변경이 Dewy 서비스 정책/도메인과 일치하는지 한 번 확인해주세요.
          labels: |
            automated
            marketing-skills
